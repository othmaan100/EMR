
name: Deploy to cPanel (emr.tepan.com.ng)

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # match the version set in cPanel MultiPHP Manager
          extensions: mbstring, pdo_mysql, openssl, fileinfo, gd, curl, intl, zip
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Upload to server over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            tests/**
            .env
            .env.*
            !.env.example
            public/uploads/**
            storage/app/installed.lock
            storage/app/private/**
            storage/app/backups/**
            storage/logs/*.log
            storage/framework/cache/data/**
            storage/framework/sessions/*
            storage/framework/views/*.php
            phpunit.xml
